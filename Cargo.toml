[package]
name = "legend_shot"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.3"
egui = { version = "0.33.2", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.33.2", default-features = false, features = ["glow", "accesskit", "x11"] }
rfd = "0.15.4"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9.4"
device_query = "4.0.1"
clap = { version = "4.5", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
directories = "6.0"
oar-ocr = { version = "=0.7.0", features = ["auto-download"] }
ab_glyph = "0.2.32"
imageproc = "0.26.2"
global-hotkey = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tray-icon = "0.24.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", features = ["v3_24"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindow"] }
winit = { version = "0.30.12", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

